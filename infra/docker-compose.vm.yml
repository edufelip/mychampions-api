name: mychampions-server

x-server-base: &server-base
  image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}
  env_file: .env
  networks:
    - root_default
  volumes:
    - ./secrets/mychampions-gcs-service-account.json:/run/secrets/mychampions-gcs-service-account.json:ro
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "fetch('http://127.0.0.1:3400/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 15s
    timeout: 5s
    retries: 8
    start_period: 20s

services:
  migrate:
    <<: *server-base
    command: ["bun", "run", "db:migrate"]
    restart: "no"

  blue:
    <<: *server-base
    container_name: mychampions-server-blue
    ports:
      - "127.0.0.1:3400:3400"
    restart: unless-stopped

  green:
    <<: *server-base
    container_name: mychampions-server-green
    ports:
      - "127.0.0.1:3401:3400"
    restart: unless-stopped

networks:
  root_default:
    external: true
