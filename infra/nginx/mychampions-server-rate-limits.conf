# This file is installed into nginx's http context, not a server block. Trust
# only Nginx's socket peer for the coarse ingress guard: forwarded headers are
# client-controlled until the trusted edge has normalized them. An empty map
# value disables accounting, so browser OPTIONS preflights and other methods
# are not consumed by the POST-only support budget.
map $request_method $mychampions_support_rate_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $mychampions_support_rate_limit_key zone=mychampions_support_per_ip:10m rate=30r/m;
