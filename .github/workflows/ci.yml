name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      full_scope: ${{ steps.classify.outputs.full_scope }}
      merge_base: ${{ steps.classify.outputs.merge_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Pushes to main are the authoritative build (post-merge or a direct
      # push), so they always run the full suite. Only PRs get narrowed.
      # The merge-base is computed explicitly inside classify-change-scope.ts
      # (not diffed against the base branch tip) so commits that land on main
      # after a PR branched off are never misattributed to that PR's diff.
      - id: classify
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "full_scope=true" >> "$GITHUB_OUTPUT"
            echo "merge_base=" >> "$GITHUB_OUTPUT"
          else
            bun scripts/ci/classify-change-scope.ts "$BASE_SHA" "$HEAD_SHA"
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    name: Test
    needs: impact
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mychampions_local
          POSTGRES_PASSWORD: mychampions_local_password
          POSTGRES_DB: mychampions_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mychampions_local -d mychampions_local"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mychampions_local:mychampions_local_password@localhost:5432/mychampions_server_local
      FOOD_CATALOG_DATABASE_URL: postgres://mychampions_local:mychampions_local_password@localhost:5432/mychampions_food_catalog_local
      EXERCISE_CATALOG_DATABASE_URL: postgres://mychampions_local:mychampions_local_password@localhost:5432/mychampions_exercise_catalog_local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile

      # Mirrors infra/local-postgres/initdb/001-catalog-databases.sql: the
      # postgres service only creates its initial POSTGRES_DB, so the three
      # app-owned databases still need to be created before migrating.
      - name: Create service databases
        env:
          PGPASSWORD: mychampions_local_password
        run: |
          psql -h localhost -U mychampions_local -d mychampions_local -c "CREATE DATABASE mychampions_server_local OWNER mychampions_local;"
          psql -h localhost -U mychampions_local -d mychampions_local -c "CREATE DATABASE mychampions_food_catalog_local OWNER mychampions_local;"
          psql -h localhost -U mychampions_local -d mychampions_local -c "CREATE DATABASE mychampions_exercise_catalog_local OWNER mychampions_local;"

      - name: Apply schema migrations
        run: bun run db:migrate

      # The food/exercise catalog databases only get their schema+rows from a
      # production mirror (`bun run local:db:mirror`), which hosted CI can't
      # do. Tests that need real catalog rows self-skip when CI=true (GitHub
      # Actions sets this automatically) — see
      # tests/postgres-{exercise,food}-search-gateway.test.ts.
      - name: Run tests
        env:
          FULL_SCOPE: ${{ needs.impact.outputs.full_scope }}
          MERGE_BASE: ${{ needs.impact.outputs.merge_base }}
        run: |
          if [[ "$FULL_SCOPE" != "true" && -n "$MERGE_BASE" ]]; then
            echo "Running tests related to changes since $MERGE_BASE"
            bun test --changed="$MERGE_BASE" --pass-with-no-tests
          else
            echo "Running full test suite"
            bun test
          fi

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build .
