name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only cancel in-progress runs for PR updates. Pushes to main are the
  # authoritative build (see the `impact` job below) and must always finish,
  # so a rapid second push must not cancel an in-flight main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      full_scope: ${{ steps.classify.outputs.full_scope }}
      merge_base: ${{ steps.classify.outputs.merge_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Pushes to main are the authoritative build (post-merge or a direct
      # push), so they always run the full suite. Only PRs get narrowed.
      # The merge-base is computed explicitly inside classify-change-scope.ts
      # (not diffed against the base branch tip) so commits that land on main
      # after a PR branched off are never misattributed to that PR's diff.
      - id: classify
        name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "full_scope=true" >> "$GITHUB_OUTPUT"
            echo "merge_base=" >> "$GITHUB_OUTPUT"
          else
            bun scripts/ci/classify-change-scope.ts "$BASE_SHA" "$HEAD_SHA"
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    name: Test
    needs: impact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      # Unit tests are every tests/*.test.ts file except tests/postgres-*.
      # They never open a database. Pull requests narrow them to the files
      # Bun relates to the diff; pushes to main run all of them.
      - name: Unit tests
        env:
          FULL_SCOPE: ${{ needs.impact.outputs.full_scope }}
          MERGE_BASE: ${{ needs.impact.outputs.merge_base }}
        run: |
          if [[ "$FULL_SCOPE" != "true" && -n "$MERGE_BASE" ]]; then
            echo "Running unit tests related to changes since $MERGE_BASE"
            bun --no-env-file scripts/testing/run.ts unit --changed="$MERGE_BASE"
          else
            echo "Running the full unit suite"
            bun run test:unit
          fi

      # Pulled separately so a registry hiccup is not reported as a harness
      # failure inside the owned runner's 120 s Docker command deadline.
      - name: Pull the owned test Postgres image
        run: |
          image="$(sed -n 's/^ *image: *//p' infra/docker-compose.test.yml)"
          docker pull "$image"

      # Every tests/postgres-* file on every run, through the same owned runner
      # developers use: a fresh label-verified Compose Postgres on a random
      # loopback port, a private manifest + owner token + in-database marker,
      # canonical migrations and synthetic catalog seeds. The test database
      # guard is unchanged. --server-only only allows the client checkout
      # (not part of this job) to be absent; see docs/ci-selective-tests.md.
      - name: Integration tests (owned disposable Postgres)
        run: bun run test:integration:server-only

      # Receipts hold identities, counts and result classes, never credentials.
      - name: Integration receipt
        if: always()
        run: |
          shopt -s nullglob
          receipts=(.qa/runtime/*/receipt.json)
          if (( ${#receipts[@]} == 0 )); then
            echo "No integration receipt was written."
            exit 0
          fi
          for receipt in "${receipts[@]}"; do
            echo "$receipt"
            cat "$receipt"
            echo
          done

      # Independent census: every run directory is a run ID, and no container
      # or network carrying that run's label may survive cleanup.
      - name: Confirm owned Docker resources were removed
        if: always()
        run: |
          shopt -s nullglob
          leftover=""
          for dir in .qa/runtime/*/; do
            run="$(basename "$dir")"
            leftover+="$(docker ps -aq --filter "label=com.mychampions.test.run=$run")"
            leftover+="$(docker network ls -q --filter "label=com.mychampions.test.run=$run")"
          done
          if [[ -n "$leftover" ]]; then
            echo "::error::Owned test containers or networks remain after the integration run"
            docker ps -a --filter label=com.mychampions.test.run
            docker network ls --filter label=com.mychampions.test.run
            exit 1
          fi
          echo "No owned test containers or networks remain."

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - run: docker build .
